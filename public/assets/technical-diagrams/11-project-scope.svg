<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A focused project moves from problem to next action</title>
  <desc id="desc">A four-step path defines the problem, intended audience, finished proof, and first thirty-minute action, producing a project that can be completed in two weeks.</desc>
  <rect width="1200" height="675" fill="#F3F1EE"/><circle cx="1155" cy="20" r="130" fill="#F0ECF8"/><circle cx="5" cy="675" r="95" fill="#FCEBED"/>
  <rect x="30" y="30" width="1140" height="615" rx="24" fill="#FFFFFF" stroke="#D9DBE6"/><path d="M54 30H1146A24 24 0 0 1 1170 54V45H30V54A24 24 0 0 1 54 30Z" fill="#F06473"/>
  <text x="60" y="72" fill="#F06473" font-family="Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.8">RESUME FOUNDATIONS · 03</text>
  <text x="60" y="123" fill="#243678" font-family="Arial,sans-serif" font-size="42" font-weight="800">Scope the smallest credible project</text>
  <rect x="70" y="205" width="235" height="245" rx="18" fill="#FCEBED" stroke="#E7C7CE" stroke-width="2"/><circle cx="118" cy="253" r="25" fill="#F06473"/><text x="118" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="187" y="265" text-anchor="middle" fill="#F06473" font-family="Arial,sans-serif" font-size="23" font-weight="800">PROBLEM</text><text x="187" y="330" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">One specific</text><text x="187" y="360" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">question or need</text>
  <path d="M320 327h42" stroke="#594477" stroke-width="6"/><path d="m350 311 19 16-19 16" fill="none" stroke="#594477" stroke-width="6"/>
  <rect x="380" y="205" width="235" height="245" rx="18" fill="#F0ECF8" stroke="#D8CEE8" stroke-width="2"/><circle cx="428" cy="253" r="25" fill="#594477"/><text x="428" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="497" y="265" text-anchor="middle" fill="#594477" font-family="Arial,sans-serif" font-size="23" font-weight="800">AUDIENCE</text><text x="497" y="330" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">One person or group</text><text x="497" y="360" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">who can use it</text>
  <path d="M630 327h42" stroke="#594477" stroke-width="6"/><path d="m660 311 19 16-19 16" fill="none" stroke="#594477" stroke-width="6"/>
  <rect x="690" y="205" width="235" height="245" rx="18" fill="#E6F4F3" stroke="#BCDCD9" stroke-width="2"/><circle cx="738" cy="253" r="25" fill="#1F817C"/><text x="738" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="807" y="265" text-anchor="middle" fill="#1F817C" font-family="Arial,sans-serif" font-size="23" font-weight="800">PROOF</text><text x="807" y="330" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">One shareable</text><text x="807" y="360" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="20" font-weight="700">finished format</text>
  <path d="M940 327h42" stroke="#594477" stroke-width="6"/><path d="m970 311 19 16-19 16" fill="none" stroke="#594477" stroke-width="6"/>
  <rect x="1000" y="205" width="130" height="245" rx="18" fill="#243678"/><circle cx="1065" cy="253" r="25" fill="#F06473"/><text x="1065" y="261" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="1065" y="307" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="800">NEXT</text><text x="1065" y="334" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="800">ACTION</text><text x="1065" y="385" text-anchor="middle" fill="#E5E8F8" font-family="Arial,sans-serif" font-size="17">30 minutes</text>
  <rect x="255" y="520" width="690" height="70" rx="35" fill="#243678"/><text x="600" y="564" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="24" font-weight="800">Small enough to finish and share in two weeks</text>
