  <rect x="890" y="405" width="220" height="105" rx="18" fill="#E8ECF7" stroke="#C9D1E7" stroke-width="2"/>
  <text x="1000" y="450" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="22" font-weight="800">FOLLOW UP</text><text x="1000" y="482" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="17" font-weight="700">Appreciate + continue</text>
