  <text x="60" y="72" fill="#594477" font-family="Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.8">LINKEDIN PRESENCE · 02</text>
  <text x="60" y="122" fill="#243678" font-family="Arial,sans-serif" font-size="42" font-weight="800">Build relationships before making requests</text>
