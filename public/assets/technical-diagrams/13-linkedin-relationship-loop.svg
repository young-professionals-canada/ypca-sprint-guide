  <text x="200" y="260" text-anchor="middle" fill="#594477" font-family="Arial,sans-serif" font-size="22" font-weight="800">DISCOVER</text><text x="200" y="292" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="17" font-weight="700">Relevant people + context</text>
  <rect x="90" y="405" width="220" height="105" rx="18" fill="#E6F4F3" stroke="#BCDCD9" stroke-width="2"/>
  <text x="200" y="450" text-anchor="middle" fill="#1F817C" font-family="Arial,sans-serif" font-size="22" font-weight="800">ENGAGE</text><text x="200" y="482" text-anchor="middle" fill="#243678" font-family="Arial,sans-serif" font-size="17" font-weight="700">Read + contribute usefully</text>
