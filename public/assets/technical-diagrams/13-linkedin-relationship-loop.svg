<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Professional relationships grow through a repeatable loop</title>
  <desc id="desc">Discover relevant people, engage with their work, connect with real context, follow up respectfully, and contribute over time before repeating the cycle.</desc>
  <rect width="1200" height="675" fill="#F3F1EE"/>
  <circle cx="1155" cy="20" r="130" fill="#F0ECF8"/><circle cx="5" cy="675" r="95" fill="#FCEBED"/>
